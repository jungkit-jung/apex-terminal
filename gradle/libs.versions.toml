[versions]
# Android
agp                     = "8.7.3"
kotlin                  = "2.1.0"
ksp                     = "2.1.0-1.0.29"
compileSdk              = "35"
minSdk                  = "30"
targetSdk               = "35"

# Kotlin
coroutines              = "1.9.0"
serialization           = "1.7.3"
datetime                = "0.6.2"

# AndroidX
core-ktx                = "1.15.0"
lifecycle               = "2.8.7"
activity-compose        = "1.9.3"
compose-bom             = "2024.12.01"
navigation              = "2.8.5"
room                    = "2.6.1"
datastore               = "1.1.1"
workmanager             = "2.10.0"
security-crypto         = "1.1.0-alpha06"
biometric               = "1.2.0-alpha05"

# DI
hilt                    = "2.53.1"
hilt-navigation-compose = "1.2.0"

# Network
okhttp                  = "4.12.0"
retrofit                = "2.11.0"
protobuf                = "4.28.3"

# Web3 / On-Chain
web3j                   = "4.12.3"

# Chart / UI

# Crypto
crypto-commons          = "1.79"

# Testing
junit                   = "4.13.2"
androidx-test-ext       = "1.2.1"
espresso                = "3.6.1"

[libraries]
# Kotlin
kotlin-stdlib               = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime            = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# AndroidX Core
androidx-core-ktx           = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime  = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel= { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

# Compose BOM (manages all compose versions)
compose-bom                 = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui                  = { module = "androidx.compose.ui:ui" }
compose-ui-graphics         = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3           = { module = "androidx.compose.material3:material3" }
compose-foundation          = { module = "androidx.compose.foundation:foundation" }
compose-animation           = { module = "androidx.compose.animation:animation" }
compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-manifest    = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-test-junit4      = { module = "androidx.compose.ui:ui-test-junit4" }

# Navigation
navigation-compose          = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Room (local DB for tick history)
room-runtime                = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx                    = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler               = { module = "androidx.room:room-compiler", version.ref = "room" }

# DataStore (settings/preferences)
datastore-preferences       = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# WorkManager
workmanager                 = { module = "androidx.work:work-runtime-ktx", version.ref = "workmanager" }

# Security
security-crypto             = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
biometric                   = { module = "androidx.biometric:biometric", version.ref = "biometric" }

# Hilt DI
hilt-android                = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler               = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose     = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Network
okhttp-core                 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging              = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit-core               = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization      = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version = "1.0.0" }

# Protobuf (low-latency binary parsing)
protobuf-lite               = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }

# Web3 (for DEX interactions)
web3j-core                  = { module = "org.web3j:core", version.ref = "web3j" }

# Apache Commons Crypto (for HMAC Binance signature)
commons-crypto              = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "crypto-commons" }

# Wickplot (OHLC chart base)

# Testing
junit                       = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext           = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
espresso-core               = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application         = { id = "com.android.application", version.ref = "agp" }
android-library             = { id = "com.android.library", version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                        = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                         = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[bundles]
compose                     = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material3", "compose-foundation", "compose-animation"]
lifecycle                   = ["androidx-lifecycle-runtime", "androidx-lifecycle-viewmodel"]
network                     = ["okhttp-core", "okhttp-logging", "retrofit-core", "retrofit-serialization"]
room                        = ["room-runtime", "room-ktx"]
