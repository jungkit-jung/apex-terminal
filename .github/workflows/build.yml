name: Build Android Trading Terminal

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install NDK & CMake
        run: |
          sdkmanager "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Generate Gradle Wrapper if Missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Setup Keystore
        run: |
          mkdir -p app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          else
            echo "Generating self-signed release keystore for standalone CI..."
            keytool -genkey -v -keystore app/release.jks -alias trading_key -keyalg RSA -keysize 2048 -validity 10000 -storepass terminalpass -keypass terminalpass -dname "CN=ApexTerminal, OU=Trading, O=Standalone, L=Jakarta, S=JK, C=ID"
          fi

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexTerminal-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexTerminal-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
